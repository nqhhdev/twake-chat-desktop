# Checks every PR on the three desktop systems (ADR-013, ADR-014), then merges it by itself
# when all are green and it carries the `automerge` label.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev \
            libfontconfig1-dev libwayland-dev libgtk-3-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev \
            libfontconfig1-dev libwayland-dev libgtk-3-dev libasound2-dev
      - name: NASM for aws-lc (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p twake-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: twake-chat-${{ runner.os }}
          path: |
            target/release/twake-chat
            target/release/twake-chat.exe
          if-no-files-found: error
          retention-days: 7

  domain-replay:
    name: domain replay (recorded TS cases)
    runs-on: ubuntu-latest
    # The cases were recorded in this zone: `groupByDay` and other local-day rules read
    # the system's time zone, and a UTC runner would put some times on another day
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/units/domain-rs
      # The rust-anything harness is a napi library: built with cargo, loaded by Node.
      - run: cargo build --release --manifest-path rust/units/domain-rs/Cargo.toml
      - run: cp rust/units/domain-rs/target/release/libtwake_domain_ref.so rust/units/domain-rs/twake_domain_ref.node
      - run: node rust/tools/check-ported.mjs

  automerge:
    name: merge when green
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    needs: [lint, build, domain-replay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch
