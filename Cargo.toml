[workspace]
resolver = "3"
exclude = ["rust/units/domain-rs"]
members = ["crates/twake-domain", "crates/twake-core", "crates/twake-call", "crates/twake-desktop"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
twake-domain = { path = "crates/twake-domain" }
twake-core = { path = "crates/twake-core" }
twake-call = { path = "crates/twake-call" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
